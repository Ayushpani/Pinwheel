name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  no-ai:
    name: No-AI and no-network check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/no-ai-check.sh

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  windows-app:
    name: Build Pinwheel.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p pinwheel-windows
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/Pinwheel.exe dist/
          Copy-Item crates/pinwheel-windows/TRY-IT.txt dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Pinwheel-for-Windows
          path: dist/
          if-no-files-found: error
