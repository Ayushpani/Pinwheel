[package]
name = "pinwheel-windows"
description = "Pinwheel for Windows: the tray app and the wheel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "Pinwheel"
path = "src/main.rs"

[dependencies]
pinwheel-core.workspace = true
pinwheel-engine.workspace = true
serde.workspace = true
toml.workspace = true
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
ab_glyph = "0.2"
imagesize = "0.13"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
