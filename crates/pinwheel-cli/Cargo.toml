[package]
name = "pinwheel-cli"
description = "The Pinwheel command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "pinwheel"
path = "src/main.rs"

[dependencies]
pinwheel-core.workspace = true
pinwheel-engine.workspace = true
clap = { version = "4", features = ["derive"] }
imagesize = "0.13"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
