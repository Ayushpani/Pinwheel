[workspace]
resolver = "2"
members = ["crates/pinwheel-core", "crates/pinwheel-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ayushpani/pinwheel"
rust-version = "1.82"

[workspace.dependencies]
pinwheel-core = { path = "crates/pinwheel-core" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
