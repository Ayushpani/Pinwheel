[workspace]
resolver = "2"
members = ["crates/pinwheel-core", "crates/pinwheel-engine", "crates/pinwheel-cli", "crates/pinwheel-windows"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ayushpani/pinwheel"
rust-version = "1.82"

[workspace.dependencies]
pinwheel-core = { path = "crates/pinwheel-core" }
pinwheel-engine = { path = "crates/pinwheel-engine" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"

# Image codecs are unbearably slow unoptimised, even while developing.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
